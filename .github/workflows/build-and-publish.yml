name: Python Package

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  release:
    types:
      - published

jobs:
  build:
    # Every platform runs the tests; only Linux runs the regression tests, whose frozen
    # files were minted there (tests/conftest.py, #103), and only Linux publishes.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
      - name: Set up pip cache
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: "${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}"
          restore-keys: ${{ runner.os }}-pip-
      - name: Install Hatch
        run: pipx install hatch
      - name: Run tests
        run: hatch test
      # Reported, never failing: shows how far this platform's floats are from the
      # frozen ones, which is the evidence for whether the regression tests could compare
      # with a tolerance instead of being Linux-only.
      - name: Regression tests, for information
        if: runner.os != 'Linux'
        continue-on-error: true
        run: hatch test -- --regression -m regression
      - name: Build dist
        if: runner.os == 'Linux'
        run: hatch build
      - name: Publish artifacts to PyPI
        if: ${{ runner.os == 'Linux' && github.event.action == 'published' }}
        uses: pypa/gh-action-pypi-publish@release/v1
