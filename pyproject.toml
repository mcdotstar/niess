[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "niess"
dynamic = ["version"]
description = "Neutron instruments of the European Spallation Source as calibrated Python objects, emitting McStas instruments and ESS NeXus Structure JSON"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
keywords = []
authors = [
  { name = "Gregory Tucker", email = "gregory.tucker@ess.eu" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "scipp>=26.8.0",
  "numpy",
  "scipy",
  "mccode-antlr>=0.24.0",
  "mccode-to-kafka>=0.5.0",
  "msgspec>=0.21.1",
  "networkx>=3.6.1",
  "ncrystal>=4.4.6", # required for B4C_sg166_BoronCarbide
]

[project.optional-dependencies]
test = ['pytest']
# niess.tof sets up a tof.Model from an emitted instrument; niess imports without it.
tof = ['tof>=25.11']
# niess.brep builds solid geometry; same arrangement, and it was the one lazy import
# with nothing in here to install it by name.
brep = ['build123d']
# What the notebooks under docs/examples need to run, over and above niess itself.
# chopcal is here rather than in `tof` because niess.tof does not import it -- only the
# BIFROST notebook does, for the chopper geometry it knows and niess does not.
examples = ['tof>=25.11', 'chopcal>=0.5.1', 'plopp', 'nbclient', 'nbformat']
# Zensical is pre-1.0 and ships weekly; pin exactly and bump deliberately.
docs = [
  'zensical==0.0.57',
  'mkdocstrings-python>=2.0.6',
]


[project.urls]
Documentation = "https://mcdotstar.github.io/niess/"
Issues = "https://github.com/mcdotstar/niess/issues"
Source = "https://github.com/mcdotstar/niess"
Changelog = "https://mcdotstar.github.io/niess/release-notes/"

[tool.hatch.version]
path = "src/niess/__about__.py"

[tool.hatch.envs.default]
type = "virtual"
path = ".venv"

# `hatch test` -- which is what CI runs -- uses this environment. Without `features` it
# installs the project's dependencies and pytest and nothing else, so `niess.tof` and
# `niess.brep` were never exercised: their tests skipped, silently, on every run. The
# suite is *able* to run green without the extras (see tests/optional_dependencies.py)
# and that stays true for a bare checkout; CI is where they should actually be installed,
# because a target nobody runs is a target nobody is testing.
#
# `examples` is deliberately not here. The notebooks and the executable docs belong to the
# documentation job, which installs `[docs,test,examples]` and runs them there.
[tool.hatch.envs.hatch-test]
features = ["tof", "brep"]

[tool.hatch.envs.docs]
features = ["docs", "test"]

[tool.hatch.envs.docs.scripts]
build = "zensical build --clean --strict"
serve = "zensical serve"
check = "pytest tests/test_docs_examples.py -q"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/niess tests}"

[tool.coverage.run]
source_pkgs = ["niess", "tests"]
branch = true
parallel = true
omit = [
  "src/niess/__about__.py",
]

[tool.coverage.paths]
niess = ["src/niess", "*/niess/src/niess"]
tests = ["tests", "*/niess/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
